services:
  postgres:
    image: postgres:16-alpine
    container_name: micrup-postgres
    environment:
      POSTGRES_DB: micrup
      POSTGRES_USER: micrup
      POSTGRES_PASSWORD: micrup
    ports:
      - "5432:5432"
    volumes:
      - micrup-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micrup -d micrup"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  micrup-postgres-data:
