spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/micrup}
    username: ${DB_USERNAME:micrup}
    password: ${DB_PASSWORD:micrup}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
